services:
  vllm-server:
    image: ${VLLM_IMAGE:-vllm/vllm-openai-rocm:latest}
    container_name: vllm-bench-server
    ports:
      - "${VLLM_PORT}:8000"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ipc: host
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    env_file:
      - .env      
    command: >
      --model ${VLLM_MODEL}
      --kv-cache-dtype ${VLLM_KV_CACHE_DTYPE}
      --tensor-parallel-size ${VLLM_TENSOR_PARALLEL}
      --no-enable-prefix-caching
      --enforce-eager
      --port ${VLLM_PORT}
      --host 0.0.0.0
      --max-model-len ${VLLM_MAX_MODEL_LENGTH:-8192}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${VLLM_PORT}/v1/models"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 60s

  # Benchmark runner service
  vllm-benchmark:
    image: ${VLLM_IMAGE:-vllm/vllm-openai-rocm:latest}
    container_name: vllm-bench-runner
    depends_on:
      vllm-server:
        condition: service_healthy
    volumes:
      - ./:/workspace
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    working_dir: /workspace
    env_file:
      - .env
    environment:
      - VLLM_SERVER_HOST=vllm-server
      - VLLM_SERVER_PORT=${VLLM_PORT}
      - BENCH_TEST=${BENCH_TEST:-0}
      - BENCH_FAST=${BENCH_FAST:-0}
    entrypoint: /bin/bash
    command: /workspace/vllm_bench_runner.sh
